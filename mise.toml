[tools]
node = "24"
pnpm = "12.8.1"

[tasks.install]
description = "Install dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.lint]
depends = ["install"]
description = "Run linter"
run = "pnpm lint"

[tasks.test]
depends = ["install"]
description = "Run tests"
run = "pnpm test"

[tasks.build]
depends = ["install"]
description = "Build"
run = "pnpm run build"
