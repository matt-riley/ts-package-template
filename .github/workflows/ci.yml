name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:ci
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@82773e1ba2dc26de50fa6b1d62d31c6b873208b5 # v4
    with:
      install: true
      lint: true
      test: true
      build: true
