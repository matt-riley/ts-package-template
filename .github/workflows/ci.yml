name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:ci
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@c0e6946b1acb68a526ec34fb251d16ac1f63d358 # v4
    with:
      install: true
      lint: true
      test: true
      build: true
